name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Sanity-check Python sources
        run: python3 -m compileall -q default.py plugin.py service.py lib

      # No Kodi here, and none of these modules may import a third-party test
      # runner (the addon ships with zero third-party dependencies, by the
      # repo's own rule - see AutoCompletion.py's module docstring). tests/
      # fakes xbmc/xbmcaddon/xbmcvfs in sys.modules before import instead of
      # mocking a function call, because AutoCompletion.py resolves settings
      # and paths at IMPORT time, not inside a function a test could patch.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
